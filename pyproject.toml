[project]
name = "hermes-docs-mcp"
version = "0.1.0"
description = "Local MCP server that searches and serves the Hermes Agent documentation offline."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = ["mcp>=1.28,<2", "httpx>=0.28,<1"]

[dependency-groups]
dev = [
  "pytest>=8.4,<9",
  "pytest-asyncio>=0.24,<2",
  "pytest-cov>=6,<8",
  "ruff>=0.12",
]

[project.scripts]
hermes-docs-mcp = "hermes_docs_mcp.server:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hermes_docs_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "SIM"]
